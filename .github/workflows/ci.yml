name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Synapbiz.Brain.sln

      - name: Build
        run: dotnet build Synapbiz.Brain.sln -c Release --no-restore

      - name: Test
        run: dotnet test Synapbiz.Brain.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Pack
        run: dotnet pack Synapbiz.Brain.sln -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error
